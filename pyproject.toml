[project]
name = "ds-agent-kit"
version = "0.2.0"
description = "CLI que instala skills, agentes do Claude Code e regras de GitHub em repositórios de DS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dskit = "ds_agent_kit.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_agent_kit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
