name: Branch policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: PR deve vir de feature/*
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BASE" != "$DEFAULT" ]; then
            echo "PR para '$BASE' (não é a branch padrão) — regra não se aplica."
            exit 0
          fi
          if [[ "$HEAD" =~ ^feature/[a-z0-9._-]+(/[a-z0-9._-]+)*$ ]]; then
            echo "OK: '$HEAD'"
          else
            echo "::error::Merge em '$DEFAULT' só é permitido a partir de branches 'feature/<nome>' (recebido: '$HEAD')."
            exit 1
          fi
